spring:
  application:
    name: collector
  config:
    import: "configserver:"
  cloud:
    config:
      enabled: false
      fail-fast: true
      retry:
        use-random-policy: true
        max-interval: 6000
      discovery:
        enabled: true
        serviceId: config-server

eureka:
  instance:
    hostname: localhost
  client:
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

---
spring:
  config:
    activate:
      on-profile: prod
eureka:
  client:
    enabled: true
spring:
  cloud:
    config:
      enabled: true
